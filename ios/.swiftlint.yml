included:
  - Ilet
  - IletKit/Sources
  - IletKit/Tests
excluded:
  - IletKit/.build

# swift-format owns layout; these rules would fight it.
disabled_rules:
  - trailing_comma
  - opening_brace
  - vertical_parameter_alignment

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - private_swiftui_state
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool
  - unowned_variable_capture

line_length:
  warning: 120
  ignores_comments: false

identifier_name:
  min_length:
    warning: 2
