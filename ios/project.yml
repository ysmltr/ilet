# XcodeGen spec: `xcodegen generate` creates Ilet.xcodeproj from this file.
name: Ilet
options:
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    SWIFT_EMIT_LOC_STRINGS: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
packages:
  IletKit:
    path: IletKit
targets:
  Ilet:
    type: application
    platform: iOS
    sources:
      - path: Ilet
    dependencies:
      - package: IletKit
        product: IletCore
      # Embedded in the app, as its PlugIns/IletShare.appex.
      - target: IletShare
    # A shared scheme, so command-line builds find it without opening Xcode first.
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ILET_BUNDLE_ID_PREFIX)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Made from branding/ilet-icon.svg by desktop/scripts/render-icons.mjs.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # The app sends through a background URLSession too, so uploads carry on when the user
    # switches apps or locks the iPhone. That needs no background mode in Info.plist.
    info:
      path: Ilet/Info.plist
      properties:
        CFBundleDisplayName: ilet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The logo on the welcome page's background (white, or black in Dark Mode). LaunchView
        # shows the same in the app until the paired PCs are loaded, so the start has no jump.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: Logo
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: ilet uses the camera only to scan the pairing QR code shown on your PC.
        NSLocalNetworkUsageDescription: ilet sends your files directly to your PC over your local network.
        # iOS lets the app look for exactly these Bonjour services, and no others.
        NSBonjourServices:
          - _ilet._tcp
        # Only the local-network exception: ATS stays on for everything else. Local PCs cannot
        # have certificates from a public CA; the app's certificate pin replaces that check.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Only the system's HTTPS (TLS) and hashing are used, which are exempt from export
        # documentation; App Store Connect then does not ask about encryption for each build.
        ITSAppUsesNonExemptEncryption: false
        IletAppGroupIdentifier: group.$(ILET_BUNDLE_ID_PREFIX)
        # Starts with the App ID prefix, which is the team ID. It is spelled out because Xcode's
        # $(AppIdentifierPrefix) comes from a provisioning profile, and the TestFlight workflow
        # builds without one (the app is signed afterwards, when it is exported).
        IletKeychainAccessGroup: $(DEVELOPMENT_TEAM).$(ILET_BUNDLE_ID_PREFIX).shared
    entitlements:
      path: Ilet/Ilet.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(ILET_BUNDLE_ID_PREFIX)
        # The same value as IletKeychainAccessGroup above.
        keychain-access-groups:
          - $(DEVELOPMENT_TEAM).$(ILET_BUNDLE_ID_PREFIX).shared
  # The "Share → ilet" sheet. It sends through a background URLSession, so uploads carry on after
  # the sheet closes, and iOS wakes the app for their remaining events.
  IletShare:
    type: app-extension
    platform: iOS
    sources:
      - path: IletShare
      # Shared with the app: its texts and the few views and helpers the sheet needs.
      - path: Ilet/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Ilet/Resources/InfoPlist.xcstrings
        buildPhase: resources
      - path: Ilet/App/AppConfiguration.swift
      - path: Ilet/Shared/ConversionNote.swift
      - path: Ilet/Shared/ErrorMessage.swift
      - path: Ilet/Shared/Layout.swift
      - path: Ilet/Shared/SecurityWarningView.swift
      - path: Ilet/Shared/Transfer.swift
      - path: Ilet/Shared/TransferRow.swift
    dependencies:
      - package: IletKit
        product: IletCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ILET_BUNDLE_ID_PREFIX).share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: true
        # Only embedded in the app, as in Xcode's extension templates: an archive that also holds
        # the extension on its own is not an iOS app archive, and the export refuses it.
        SKIP_INSTALL: true
    info:
      path: IletShare/Info.plist
      properties:
        CFBundleDisplayName: ilet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          # Photos, videos and files, up to 50 at a time. Links and plain text are not offered.
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 50
              NSExtensionActivationSupportsMovieWithMaxCount: 50
              NSExtensionActivationSupportsFileWithMaxCount: 50
        # The same as the app's: the sheet checks the PC before it sends, and looks for the PC's
        # announcement when its address has changed.
        NSLocalNetworkUsageDescription: ilet sends your files directly to your PC over your local network.
        NSBonjourServices:
          - _ilet._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        IletAppGroupIdentifier: group.$(ILET_BUNDLE_ID_PREFIX)
        IletKeychainAccessGroup: $(DEVELOPMENT_TEAM).$(ILET_BUNDLE_ID_PREFIX).shared
    # The app's groups: the paired PCs and settings, the copies being sent, and the tokens.
    entitlements:
      path: IletShare/IletShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(ILET_BUNDLE_ID_PREFIX)
        keychain-access-groups:
          - $(DEVELOPMENT_TEAM).$(ILET_BUNDLE_ID_PREFIX).shared
