<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ilet</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="renderer.js" defer></script>
  </head>
  <body>
    <main>
      <header class="brand">
        <img class="brand-icon" src="icon.svg" alt="" />
        <div>
          <h1 class="brand-name">ilet</h1>
          <p class="brand-tagline" data-i18n="tagline"></p>
        </div>
      </header>

      <section id="network-warning" class="warning" role="alert" hidden>
        <h2 class="warning-title" data-i18n="publicNetworkTitle"></h2>
        <p id="network-warning-text"></p>
        <div class="actions">
          <button
            id="open-network-settings"
            class="button primary"
            type="button"
            data-i18n="openNetworkSettings"
          ></button>
          <button id="check-network" class="button" type="button" data-i18n="checkAgain"></button>
        </div>
      </section>

      <div id="home-view" class="view">
        <section class="card" aria-labelledby="devices-title">
          <h2 id="devices-title" class="card-title" data-i18n="devicesTitle"></h2>
          <p id="no-devices" class="muted" data-i18n="pairIntro" hidden></p>
          <ul id="device-list" class="device-list"></ul>
          <button
            id="start-button"
            class="button primary"
            type="button"
            data-i18n="pairNewDevice"
          ></button>
        </section>

        <section class="card" aria-labelledby="settings-title">
          <h2 id="settings-title" class="card-title" data-i18n="settingsTitle"></h2>
          <p class="setting-label" data-i18n="receiveFolderLabel"></p>
          <p id="receive-folder" class="folder-path"></p>
          <p id="folder-problem" class="problem" role="alert" hidden></p>
          <div class="actions">
            <button
              id="change-folder"
              class="button"
              type="button"
              data-i18n="changeFolder"
            ></button>
            <button id="open-folder" class="button" type="button" data-i18n="openFolder"></button>
          </div>
          <label class="toggle">
            <input id="start-with-windows" type="checkbox" />
            <span data-i18n="startWithWindows"></span>
          </label>
          <p
            id="start-with-windows-note"
            class="muted small"
            data-i18n="startWithWindowsUnavailable"
            hidden
          ></p>
        </section>

        <p class="muted small" data-i18n="trayNote"></p>
      </div>

      <section id="code-view" class="card centered" hidden>
        <p class="instruction" data-i18n="scanInstruction"></p>
        <canvas id="qr-canvas" class="qr-code" role="img" data-i18n-label="qrCodeLabel"></canvas>
        <p id="countdown" class="countdown" aria-live="polite"></p>
        <p class="notice" data-i18n="screenWarning"></p>
        <button id="cancel-button" class="button" type="button" data-i18n="cancel"></button>
      </section>

      <section id="result-view" class="card centered" hidden>
        <p id="result-message" class="result" role="status"></p>
        <button id="result-button" class="button primary" type="button"></button>
        <button id="done-button" class="button" type="button" data-i18n="done"></button>
      </section>
    </main>
  </body>
</html>
