appId: com.ilet.desktop
productName: ilet
directories:
  output: release
  buildResources: installer
# Whitelist: only the production build output ships. dist-dev/ (the dev scripts), sources,
# source maps, tests and tooling are never packaged.
files:
  - dist/**/*
  - '!dist/**/*.map'
  - package.json

# Electron fuses (THREAT_MODEL.md T26) are switches inside ilet.exe itself, so no environment
# variable or command-line flag can turn these features back on.
electronFuses:
  # ELECTRON_RUN_AS_NODE would turn ilet.exe into a plain Node.js that runs any script.
  runAsNode: false
  # NODE_OPTIONS and NODE_EXTRA_CA_CERTS could load code or trust extra certificates.
  enableNodeOptionsEnvironmentVariable: false
  # --inspect would open a debugger that controls the main process.
  enableNodeCliInspectArguments: false
  # app.asar must match the hash recorded in ilet.exe, so an edited archive does not load.
  enableEmbeddedAsarIntegrityValidation: true
  # Only app.asar, never a loose app folder placed next to it.
  onlyLoadAppFromAsar: true
  # The window uses ilet://, never file://, so file pages need no extra rights.
  grantFileProtocolExtraPrivileges: false
  # ilet stores no cookies; if anything ever does, it is encrypted like in Chrome.
  enableCookieEncryption: true
  loadBrowserProcessSpecificV8Snapshot: false

win:
  # The installer, and the Microsoft Store package (STORE.md).
  target: [nsis, appx]
  icon: ../branding/ilet.ico
  # Not signed yet. To sign later, set CSC_LINK (the .pfx certificate) and CSC_KEY_PASSWORD, or
  # add azureSignOptions for Azure Trusted Signing; electron-builder then signs ilet.exe and the
  # installer.

nsis:
  # For all users, in Program Files: ordinary programs cannot change ilet's files there, and the
  # firewall rules need administrator rights anyway.
  perMachine: true
  oneClick: false
  allowToChangeInstallationDirectory: false
  include: installer/installer.nsh
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ilet

# The Microsoft Store package (STORE.md). Its manifest is installer/appxmanifest.xml, its images
# are in installer/appx (npm run icons). The Store signs the package itself, so it is not signed
# here.
appx:
  # From the Product identity page in Partner Center: Package/Identity/Name,
  # Package/Identity/Publisher and Package/Properties/PublisherDisplayName. Partner Center takes a
  # package only with exactly these values. None of them is secret: every installed copy shows
  # them, and the Store shows the publisher's display name.
  identityName: landroapps.iletFilesBetweenPhonePC
  publisher: CN=A4D7BAF1-319D-4246-89A2-9422BA49FDA7
  publisherDisplayName: landroapps
  applicationId: ilet
  # The name reserved in Partner Center (Manage app names). Windows also shows it in the Start
  # menu and on the Startup page in Settings.
  displayName: 'ilet: Files Between Phone & PC'
  # Windows draws the images as they are, without a coloured plate behind them.
  backgroundColor: transparent
  # The first is the default. Partner Center asks for a Store listing in each.
  languages: [en-US, tr-TR]
  # Windows 10 version 2004, the first with uap10 (the startup task's argument).
  minVersion: 10.0.19041.0
  maxVersionTested: 10.0.19045.0
  customManifestPath: appxmanifest.xml
  artifactName: ${productName}-Store-${version}.${ext}
