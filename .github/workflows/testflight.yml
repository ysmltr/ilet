# Builds the iPhone app on one of GitHub's Macs, signs it with the team's Apple Distribution
# certificate and uploads it to TestFlight. Start it in the Actions tab (TestFlight > Run workflow)
# or by pushing a tag that starts with testflight-. ios/APP_STORE.md lists the secrets it needs and
# explains how to make the certificate.
name: TestFlight

on:
  workflow_dispatch:
  push:
    tags: [testflight-*]

# Read-only: the workflow never changes the repository. The secrets reach only the steps that need
# them, and never pull requests.
permissions:
  contents: read

# One upload at a time; a running upload is never cancelled.
concurrency:
  group: testflight
  cancel-in-progress: false

env:
  # The same Xcode and XcodeGen as the checks in ios.yml.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ios
    env:
      # App Store Connect needs a new build number for every upload: run 7 gives 7.1, and running
      # it again gives 7.2.
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      # Pinned to a commit, because a tag such as v7 can be moved to different code.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checks only the format and prints nothing: a mix-up such as the Issuer ID in ASC_KEY_ID
      # would otherwise fail only at the end, with a vague message from Apple.
      - name: Check the secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_DISTRIBUTION_KEY: ${{ secrets.APPLE_DISTRIBUTION_KEY }}
        run: |
          problems=0
          problem() {
            echo "::error title=Secrets::$1"
            problems=1
          }
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] ||
            problem "ASC_KEY_ID must be the key's Key ID: 10 letters and digits, without spaces."
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$ ]] ||
            problem "ASC_ISSUER_ID must be the Issuer ID shown above the keys: 36 characters such as 1a2b3c4d-…, without spaces."
          [[ "$ASC_KEY_P8" == *"-----BEGIN PRIVATE KEY-----"*"-----END PRIVATE KEY-----"* ]] ||
            problem "ASC_KEY_P8 must be the whole downloaded .p8 file, from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY-----."
          [[ "$APPLE_DISTRIBUTION_KEY" == *"-----BEGIN PRIVATE KEY-----"*"-----END PRIVATE KEY-----"* ||
            "$APPLE_DISTRIBUTION_KEY" == *"-----BEGIN RSA PRIVATE KEY-----"*"-----END RSA PRIVATE KEY-----"* ]] ||
            problem "APPLE_DISTRIBUTION_KEY must be the whole ilet-distribution.key file, from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY----- (see ios/APP_STORE.md)."
          exit "$problems"

      # Same rules as the npm packages: an exact version, checked against the SHA-256 that GitHub
      # publishes for the release file.
      - name: Install XcodeGen
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location --output "$tools/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $tools/xcodegen.zip" | shasum --algorithm 256 --check
          unzip -q "$tools/xcodegen.zip" -d "$tools/xcodegen"
          # XcodeGen finds its templates next to its binary, so the folders stay as unpacked.
          binary=$(find "$tools/xcodegen" -type f -name xcodegen | head -n 1)
          test -x "$binary"
          dirname "$binary" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        run: xcodegen generate

      # Built unsigned, before any key is on this Mac; the export below signs the app.
      - name: Build the archive
        run: |
          xcodebuild archive \
            -project Ilet.xcodeproj -scheme Ilet -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ilet.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcbeautify --renderer github-actions

      # The export takes each bundle's entitlements (its App Group and Keychain group) from the
      # archive's signature, and an unsigned bundle has none. So the Share Extension and the app are
      # signed here without a certificate (ad hoc), each with its .entitlements file filled in from
      # its build settings the way Xcode does it. The export replaces these signatures with the
      # distribution certificate's.
      - name: Add the entitlements to the archive
        run: |
          app="$RUNNER_TEMP/Ilet.xcarchive/Products/Applications/Ilet.app"
          extensions=$(find "$app/PlugIns" -mindepth 1 -maxdepth 1 2> /dev/null || true)
          if [ "$extensions" != "$app/PlugIns/IletShare.appex" ]; then
            echo "::error::The app's extensions are not just IletShare.appex: sign each one here with its own entitlements, and give each its own provisioning profile."
            exit 1
          fi
          # $1: the target, $2: its entitlements file. Writes the target's build settings and the
          # filled-in entitlements to RUNNER_TEMP.
          entitlements() {
            xcodebuild -showBuildSettings -project Ilet.xcodeproj -target "$1" -configuration Release \
              > "$RUNNER_TEMP/$1-build-settings.txt"
            perl -pe '
              BEGIN { open my $f, "<", shift or die; while (<$f>) { $s{$1} //= $2 if /^\s+(\w+) = (.*)$/ } }
              s{\$\((\w+)\)}{length($s{$1} // "") ? $s{$1} : die "no value for the build setting $1\n"}ge
            ' "$RUNNER_TEMP/$1-build-settings.txt" "$2" > "$RUNNER_TEMP/$1.entitlements"
          }
          entitlements Ilet Ilet/Ilet.entitlements
          entitlements IletShare IletShare/IletShare.entitlements
          # Code inside the app (Swift libraries that Xcode may add) is signed first, without
          # entitlements; then the extension, and the app last, because its signature covers the
          # extension's.
          find "$app" -mindepth 2 \( -name '*.dylib' -o -name '*.framework' \) -prune \
            -exec codesign --force --sign - {} \;
          codesign --force --sign - --entitlements "$RUNNER_TEMP/IletShare.entitlements" \
            --generate-entitlement-der "$app/PlugIns/IletShare.appex"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/Ilet.entitlements" \
            --generate-entitlement-der "$app"

      # Written only now, after XcodeGen (a downloaded program) has run, and readable only by this
      # user. The last step deletes them. altool looks for the App Store Connect key under this
      # name in the private_keys folder.
      - name: Prepare the keys
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_DISTRIBUTION_KEY: ${{ secrets.APPLE_DISTRIBUTION_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/signing"
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$APPLE_DISTRIBUTION_KEY" | tr -d '\r' > "$RUNNER_TEMP/signing/distribution.key"

      # The repository's own helper finds the certificate that belongs to APPLE_DISTRIBUTION_KEY
      # and, for the app and for its Share Extension, an App Store provisioning profile with it,
      # which it makes the first time (this needs the key's Admin access). It is tested in ios.yml.
      # A profile lists its App ID's App Groups, so an App ID without the app's group is caught
      # here, with what to do, rather than as a vague error in the export.
      - name: Get the certificate and the provisioning profiles
        id: signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          signing="$RUNNER_TEMP/signing"
          app="$RUNNER_TEMP/Ilet.xcarchive/Products/Applications/Ilet.app"
          value() { /usr/libexec/PlistBuddy -c "Print :$2" "$1" 2>/dev/null; }
          # True if the list $2 in the plist $1 contains $3.
          contains() {
            local index=0 item
            while item=$(value "$1" "$2:$index"); do
              [ "$item" = "$3" ] && return 0
              index=$((index + 1))
            done
            return 1
          }
          app_id=$(value "$app/Info.plist" CFBundleIdentifier)
          share_id=$(value "$app/PlugIns/IletShare.appex/Info.plist" CFBundleIdentifier)
          group=$(value "$app/Info.plist" IletAppGroupIdentifier)
          node ../.github/scripts/app-store-connect.mjs \
            --api-key "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            --distribution-key "$signing/distribution.key" \
            --bundle-id "$app_id" --bundle-id "$share_id" --out "$signing"
          problems=0
          for id in "$app_id" "$share_id"; do
            security cms -D -i "$signing/$id.mobileprovision" > "$signing/$id.plist"
            if ! contains "$signing/$id.plist" Entitlements:com.apple.security.application-groups "$group"; then
              echo "::error title=App ID::The App ID $id does not have the App Group $group. On developer.apple.com: Identifiers, $id, App Groups, Configure, tick $group, Continue, Save (ios/APP_STORE.md). Then run this workflow again."
              problems=1
            fi
          done
          {
            echo "app-id=$app_id"
            echo "share-id=$share_id"
            echo "certificate-sha1=$(shasum -a 1 "$signing/certificate.cer" | cut -d ' ' -f 1 | tr a-f A-F)"
            echo "app-profile=$(value "$signing/$app_id.plist" UUID)"
            echo "share-profile=$(value "$signing/$share_id.plist" UUID)"
          } >> "$GITHUB_OUTPUT"
          exit "$problems"

      # A keychain of its own, with a random password that is never printed, so that codesign
      # never asks for a password and the key is gone once the keychain is deleted.
      - name: Set up the signing keychain
        env:
          CERTIFICATE_SHA1: ${{ steps.signing.outputs.certificate-sha1 }}
          APP_ID: ${{ steps.signing.outputs.app-id }}
          SHARE_ID: ${{ steps.signing.outputs.share-id }}
          APP_PROFILE: ${{ steps.signing.outputs.app-profile }}
          SHARE_PROFILE: ${{ steps.signing.outputs.share-profile }}
        run: |
          signing="$RUNNER_TEMP/signing"
          keychain="$signing/signing.keychain-db"
          password=$(/usr/bin/openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # macOS's own LibreSSL writes the classic .p12 format that `security import` reads.
          /usr/bin/openssl x509 -inform DER -in "$signing/certificate.cer" -out "$signing/certificate.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$signing/distribution.key" \
            -in "$signing/certificate.pem" -passout "pass:$password" -out "$signing/identity.p12"
          security import "$signing/identity.p12" -k "$keychain" -P "$password" -T /usr/bin/codesign
          # Lets codesign use the key without a dialog. The output describes the key, so it is
          # not shown.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" \
            "$keychain" > /dev/null
          keychains=("$keychain")
          while read -r line; do
            keychains+=("$(echo "$line" | tr -d '"')")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          # The identity is valid only with Apple's intermediate certificate. If this Mac does not
          # have it, it comes from the address in the certificate; it still has to lead to Apple's
          # root certificate, which macOS has. The list of identities holds the person's name, so
          # it is only searched, never printed.
          valid() {
            local identities
            identities=$(security find-identity -v -p codesigning "$keychain")
            [[ "$identities" == *"$CERTIFICATE_SHA1"* ]]
          }
          if ! valid; then
            issuer=$(/usr/bin/openssl x509 -inform DER -in "$signing/certificate.cer" -noout -text |
              sed -n 's/^ *CA Issuers - URI://p' | head -n 1)
            curl --fail --silent --show-error --location --max-time 60 \
              --output "$signing/issuer.cer" "$issuer"
            security import "$signing/issuer.cer" -k "$keychain"
          fi
          if ! valid; then
            echo "::error title=Signing keychain::The certificate cannot sign on this Mac: macOS does not accept its chain of certificates."
            exit 1
          fi
          # Xcode 16 and later look for profiles in the first folder, earlier versions in the second.
          for folder in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$folder"
            cp "$signing/$APP_ID.mobileprovision" "$folder/$APP_PROFILE.mobileprovision"
            cp "$signing/$SHARE_ID.mobileprovision" "$folder/$SHARE_PROFILE.mobileprovision"
          done

      # Signs with exactly this certificate and these profiles ("manual" signing). Apple's own
      # cloud signing is not used: for an account holder's name with letters such as ş or İ, it
      # writes the name into the signature in a different Unicode form than the certificate has,
      # and App Store Connect then rejects the build (error 90035).
      - name: Sign for the App Store
        id: export
        env:
          CERTIFICATE_SHA1: ${{ steps.signing.outputs.certificate-sha1 }}
          APP_ID: ${{ steps.signing.outputs.app-id }}
          SHARE_ID: ${{ steps.signing.outputs.share-id }}
          APP_PROFILE: ${{ steps.signing.outputs.app-profile }}
          SHARE_PROFILE: ${{ steps.signing.outputs.share-profile }}
        run: |
          team=$(sed -n 's/^ *DEVELOPMENT_TEAM = //p' "$RUNNER_TEMP/Ilet-build-settings.txt" | head -n 1)
          test -n "$team"
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$team</string>
            <key>signingCertificate</key>
            <string>$CERTIFICATE_SHA1</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_ID</key>
              <string>$APP_PROFILE</string>
              <key>$SHARE_ID</key>
              <string>$SHARE_PROFILE</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Ilet.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            2>&1 | tee "$RUNNER_TEMP/export.log"

      # Checks what App Store Connect would reject, before anything is uploaded, in the app and in
      # its Share Extension: a bundle without the App Group or Keychain group could not reach the
      # pairings, and a signature that fails its own check is error 90035.
      - name: Check the signed app
        env:
          CERTIFICATE_SHA1: ${{ steps.signing.outputs.certificate-sha1 }}
        run: |
          unzip -q "$RUNNER_TEMP"/export/*.ipa -d "$RUNNER_TEMP/ipa"
          value() { /usr/libexec/PlistBuddy -c "Print :$2" "$1" 2>/dev/null; }
          # True if the list $2 in the plist $1 contains $3.
          contains() {
            local index=0 item
            while item=$(value "$1" "$2:$index"); do
              [ "$item" = "$3" ] && return 0
              index=$((index + 1))
            done
            return 1
          }
          problems=0
          problem() {
            echo "::error title=Check the signed app::$1"
            problems=1
          }
          # $1: the bundle's name, $2: the entitlement, $3: the group, $4: what it is called here.
          check_group() {
            contains "$RUNNER_TEMP/$1.signed.plist" "$2" "$3" && return 0
            if contains "$RUNNER_TEMP/$1.archived.plist" "$2" "$3"; then
              problem "The export dropped the $4 $3 from $1, which the archive had."
            else
              problem "$1 is missing the $4 $3, and the archive did not have it either."
            fi
          }
          # $1: the bundle's path in the app: Ilet.app or Ilet.app/PlugIns/IletShare.appex.
          check_bundle() {
            local name signed verify
            name=$(basename "$1")
            signed="$RUNNER_TEMP/ipa/Payload/$1"
            codesign --display --entitlements - --xml "$signed" > "$RUNNER_TEMP/$name.signed.plist"
            codesign --display --entitlements - --xml \
              "$RUNNER_TEMP/Ilet.xcarchive/Products/Applications/$1" > "$RUNNER_TEMP/$name.archived.plist"
            # The extension reads what the app saves, so both name the same groups.
            [ "$(value "$signed/Info.plist" IletAppGroupIdentifier)" = "$group" ] ||
              problem "The Info.plist of $name does not name the App Group $group."
            [ "$(value "$signed/Info.plist" IletKeychainAccessGroup)" = "$keychain" ] ||
              problem "The Info.plist of $name does not name the Keychain group $keychain."
            check_group "$name" com.apple.security.application-groups "$group" "App Group"
            check_group "$name" keychain-access-groups "$keychain" "Keychain group"
            [ "$(value "$RUNNER_TEMP/$name.signed.plist" get-task-allow)" != true ] ||
              problem "$name allows debugging (get-task-allow), which the App Store refuses."
            # App Store Connect wants an extension to have its app's version and build number.
            [ "$(value "$signed/Info.plist" CFBundleShortVersionString)" = "$version" ] ||
              problem "The version of $name is not $version."
            [ "$(value "$signed/Info.plist" CFBundleVersion)" = "$BUILD_NUMBER" ] ||
              problem "The build number of $name is not $BUILD_NUMBER."
            # Without -R, codesign also checks that the bundle satisfies its designated
            # requirement, which names the certificate. Its output holds only paths.
            if ! verify=$(codesign --verify --strict --verbose=2 "$signed" 2>&1); then
              problem "codesign rejects the signature of $name: $(echo "$verify" | tr '\n' ' ' | sed "s|$RUNNER_TEMP/||g")"
            fi
            codesign --display --extract-certificates="$RUNNER_TEMP/$name.certificate-" "$signed" 2> /dev/null
            [ "$(shasum -a 1 "$RUNNER_TEMP/$name.certificate-0" | cut -d ' ' -f 1 | tr a-f A-F)" = "$CERTIFICATE_SHA1" ] ||
              problem "$name is not signed with the certificate of APPLE_DISTRIBUTION_KEY."
          }
          info="$RUNNER_TEMP/ipa/Payload/Ilet.app/Info.plist"
          group=$(value "$info" IletAppGroupIdentifier) ||
            problem "Info.plist has no IletAppGroupIdentifier."
          keychain=$(value "$info" IletKeychainAccessGroup) ||
            problem "Info.plist has no IletKeychainAccessGroup."
          version=$(value "$info" CFBundleShortVersionString) ||
            problem "Info.plist has no CFBundleShortVersionString."
          check_bundle Ilet.app
          check_bundle Ilet.app/PlugIns/IletShare.appex
          if [ "$problems" = 0 ]; then
            echo "::notice title=Signed for the App Store::Build $BUILD_NUMBER: the app and its Share Extension keep the App Group $group and the Keychain group $keychain, and their signatures pass codesign's check."
          fi
          exit "$problems"

      # Uploads exactly the .ipa checked above.
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ipa=("$RUNNER_TEMP"/export/*.ipa)
          if ! API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys" xcrun altool --upload-app \
            -f "${ipa[0]}" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json > "$RUNNER_TEMP/upload.txt" 2>&1; then
            # A workflow command is one line, and the annotation is public, so certificate names
            # lose the person's name.
            message=$(tr '\n' ' ' < "$RUNNER_TEMP/upload.txt" | sed -E \
              -e 's/ +/ /g' -e 's/%/%25/g' \
              -e 's/((Apple|iPhone|iOS) (Distribution|Development)): [^"(]+/\1: <name> /g' |
              cut -c 1-3500)
            echo "::error title=Upload::$message"
            exit 1
          fi
          echo "::notice title=Uploaded::Build $BUILD_NUMBER is uploaded. Apple processes it for a few minutes; then it appears under TestFlight in App Store Connect."

      # xcodebuild's own export errors are often vague; the log bundle that the export writes says
      # why it failed. Its errors become annotations, which can be read without signing in, so
      # certificate names lose the person's name.
      - name: Explain a failed export
        if: failure() && steps.export.outcome == 'failure'
        run: |
          {
            grep -h -E '^(xcodebuild: )?error' "$RUNNER_TEMP/export.log" || true
            for bundle in $(grep -h -o '/[^"]*\.xcdistributionlogs' "$RUNNER_TEMP/export.log" | sort -u); do
              cat "$bundle/IDEDistribution.critical.log" || true
              grep -h -i 'error' "$bundle/IDEDistribution.standard.log" || true
            done
          } 2>/dev/null | awk 'NF && !seen[$0]++' | head -n 10 | cut -c 1-1000 |
            sed -E -e 's/%/%25/g' \
              -e 's/((Apple|iPhone|iOS) (Distribution|Development)): [^"(]+/\1: <name> /g' \
              -e 's/^/::error title=Export::/' || true

      - name: Delete the keys and the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing/signing.keychain-db" 2> /dev/null || true
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/signing"
