# TEMPORARY signing diagnostics, pushed only as the tag testflight-diag-1 (never to main).
# Variants of the archive before Apple's cloud signing:
#   U = unsigned (linker signature only), A = ad hoc with entitlements,
#   S = signed with a throwaway self-signed identity, with entitlements.
name: TestFlight

on:
  push:
    tags: [testflight-*]

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ios
    env:
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location --output "$tools/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $tools/xcodegen.zip" | shasum --algorithm 256 --check
          unzip -q "$tools/xcodegen.zip" -d "$tools/xcodegen"
          binary=$(find "$tools/xcodegen" -type f -name xcodegen | head -n 1)
          test -x "$binary"
          dirname "$binary" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the archive
        run: |
          xcodebuild archive \
            -project Ilet.xcodeproj -scheme Ilet -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ilet.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcbeautify --renderer github-actions

      - name: Make the variants
        run: |
          app_in() { echo "$RUNNER_TEMP/Ilet-$1.xcarchive/Products/Applications/Ilet.app"; }
          for v in U A S; do cp -R "$RUNNER_TEMP/Ilet.xcarchive" "$RUNNER_TEMP/Ilet-$v.xcarchive"; done
          xcodebuild -showBuildSettings -project Ilet.xcodeproj -target Ilet -configuration Release \
            > "$RUNNER_TEMP/build-settings.txt"
          perl -pe '
            BEGIN { open my $f, "<", shift or die; while (<$f>) { $s{$1} //= $2 if /^\s+(\w+) = (.*)$/ } }
            s{\$\((\w+)\)}{length($s{$1} // "") ? $s{$1} : die "no value for the build setting $1\n"}ge
          ' "$RUNNER_TEMP/build-settings.txt" Ilet/Ilet.entitlements > "$RUNNER_TEMP/Ilet.entitlements"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/Ilet.entitlements" \
            --generate-entitlement-der "$(app_in A)"

      - name: Make variant S
        continue-on-error: true
        run: |
          app_in() { echo "$RUNNER_TEMP/Ilet-$1.xcarchive/Products/Applications/Ilet.app"; }
          dir="$RUNNER_TEMP/identity"
          mkdir -p "$dir"
          printf '%s\n' '[req]' 'distinguished_name = dn' 'x509_extensions = ext' 'prompt = no' \
            '[dn]' 'CN = ilet archive' \
            '[ext]' 'basicConstraints = critical, CA:false' 'keyUsage = critical, digitalSignature' \
            'extendedKeyUsage = critical, codeSigning' > "$dir/openssl.cnf"
          echo "::notice title=openssl::$(/usr/bin/openssl version)"
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 2 -config "$dir/openssl.cnf" \
            -keyout "$dir/key.pem" -out "$dir/cert.pem" 2>/dev/null
          password=$(/usr/bin/openssl rand -hex 16)
          /usr/bin/openssl pkcs12 -export -inkey "$dir/key.pem" -in "$dir/cert.pem" \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
            -passout "pass:$password" -out "$dir/identity.p12"
          keychain="$dir/archive.keychain-db"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$dir/identity.p12" -k "$keychain" -P "$password" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          hash=$(/usr/bin/openssl x509 -noout -fingerprint -sha1 -in "$dir/cert.pem" | sed 's/.*=//; s/://g')
          codesign --force --sign "$hash" --keychain "$keychain" \
            --entitlements "$RUNNER_TEMP/Ilet.entitlements" --generate-entitlement-der "$(app_in S)"
          security delete-keychain "$keychain"

      - name: Show the archives
        run: |
          app_in() { echo "$RUNNER_TEMP/Ilet-$1.xcarchive/Products/Applications/Ilet.app"; }
          for v in U A S; do
            summary=$(codesign -dvvv "$(app_in $v)" 2>&1 | grep -E '^(CodeDirectory|Signature=|Authority)' \
              | head -n 3 | sed -E 's/^Authority=([^:]*).*/Authority=\1/' | tr '\n' ';')
            echo "::notice title=Archive $v::$summary"
          done

      - name: Prepare the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/AuthKey.p8"

      - name: Export the variants
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          team=$(sed -n 's/^ *DEVELOPMENT_TEAM = //p' "$RUNNER_TEMP/build-settings.txt" | head -n 1)
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$team</string>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          for v in U A S; do
            if xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Ilet-$v.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export-$v" \
              -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
              -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              > "$RUNNER_TEMP/export-$v.log" 2>&1; then
              echo "export $v succeeded"
            else
              echo "::warning title=Export $v::$(grep -E '^error' "$RUNNER_TEMP/export-$v.log" | head -n 2 | tr '\n' ' ' | cut -c 1-900)"
            fi
          done

      - name: Inspect the variants
        id: inspect
        run: |
          requirement='anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.4]'
          for v in U A S; do
            ipa=("$RUNNER_TEMP/export-$v"/*.ipa)
            if [ ! -f "${ipa[0]}" ]; then
              echo "::notice title=Variant $v::no .ipa"
              continue
            fi
            unzip -q "${ipa[0]}" -d "$RUNNER_TEMP/ipa-$v"
            app="$RUNNER_TEMP/ipa-$v/Payload/Ilet.app"
            summary=$(codesign -dvvv "$app" 2>&1 | grep -E '^(CodeDirectory|Signature=|Authority)' \
              | head -n 3 | sed -E 's/^Authority=([^:]*).*/Authority=\1/' | tr '\n' ';')
            if codesign --verify --strict -R="$requirement" "$app" 2> "$RUNNER_TEMP/requirement-$v.txt"; then
              result=pass
              echo "pass_$v=true" >> "$GITHUB_OUTPUT"
            else
              result="FAIL $(tr '\n' ' ' < "$RUNNER_TEMP/requirement-$v.txt" | cut -c 1-200)"
            fi
            entitlements=$(codesign -d --entitlements - --xml "$app" 2> /dev/null || true)
            group=no
            [[ "$entitlements" == *group.com.ysmltr.ilet* ]] && group=yes
            keychain=no
            [[ "$entitlements" == *5YL733ZJ5D.com.ysmltr.ilet.shared* ]] && keychain=yes
            type=$(/usr/libexec/PlistBuddy -c 'Print :Ilet.ipa:0:certificate:type' \
              "$RUNNER_TEMP/export-$v/DistributionSummary.plist" 2> /dev/null || echo unknown)
            echo "::notice title=Variant $v::requirement=$result | $summary | certificate=$type | appGroup=$group keychainGroup=$keychain"
          done
          {
            grep -h -o 'codesign.*--preserve-metadata[^ ]*' "$RUNNER_TEMP"/export-*/Packaging.log 2> /dev/null || true
            find "${TMPDIR:-/tmp}" -maxdepth 2 -name '*.xcdistributionlogs' -print0 2> /dev/null \
              | xargs -0 -I{} grep -h -o -r 'codesign.*--preserve-metadata[^ ]*' {} 2> /dev/null || true
          } | sed -E 's/[0-9A-F]{40}/<sha1>/g' | sort -u | head -n 3 | cut -c 1-900 \
            | sed 's/^/::notice title=codesign call::/' || true

      - name: Upload variant S
        if: steps.inspect.outputs.pass_S == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cp "$RUNNER_TEMP/export.plist" "$RUNNER_TEMP/upload.plist"
          plutil -replace destination -string upload "$RUNNER_TEMP/upload.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Ilet-S.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/upload.plist" -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/upload.log" ||
            { echo "::error title=Upload S::$(grep -E '^error' "$RUNNER_TEMP/upload.log" | head -n 2 | tr '\n' ' ' | cut -c 1-900)"; exit 1; }
          echo "::notice title=Uploaded::Build $BUILD_NUMBER (variant S) uploaded."

      - name: Delete the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
