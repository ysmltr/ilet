# TEMPORARY signing diagnostics, pushed only as the tag testflight-diag-3 (never to main).
# Exports the ad hoc pre-signed archive, inspects the signature and the embedded profile, then
# has App Store Connect validate that exact .ipa with altool, and uploads it if it passes.
name: TestFlight

on:
  push:
    tags: [testflight-*]

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: ios
    env:
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl --fail --silent --show-error --location --output "$tools/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $tools/xcodegen.zip" | shasum --algorithm 256 --check
          unzip -q "$tools/xcodegen.zip" -d "$tools/xcodegen"
          binary=$(find "$tools/xcodegen" -type f -name xcodegen | head -n 1)
          test -x "$binary"
          dirname "$binary" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the archive
        run: |
          xcodebuild archive \
            -project Ilet.xcodeproj -scheme Ilet -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ilet.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcbeautify --renderer github-actions

      - name: Add the entitlements to the archive
        run: |
          app="$RUNNER_TEMP/Ilet.xcarchive/Products/Applications/Ilet.app"
          xcodebuild -showBuildSettings -project Ilet.xcodeproj -target Ilet -configuration Release \
            > "$RUNNER_TEMP/build-settings.txt"
          perl -pe '
            BEGIN { open my $f, "<", shift or die; while (<$f>) { $s{$1} //= $2 if /^\s+(\w+) = (.*)$/ } }
            s{\$\((\w+)\)}{length($s{$1} // "") ? $s{$1} : die "no value for the build setting $1\n"}ge
          ' "$RUNNER_TEMP/build-settings.txt" Ilet/Ilet.entitlements > "$RUNNER_TEMP/Ilet.entitlements"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/Ilet.entitlements" \
            --generate-entitlement-der "$app"
          echo "::notice title=Archive::$(ls "$app" | tr '\n' ' ' | cut -c 1-600)"

      - name: Prepare the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/AuthKey.p8"
          mkdir -p "$RUNNER_TEMP/private_keys"
          cp "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Sign for the App Store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          team=$(sed -n 's/^ *DEVELOPMENT_TEAM = //p' "$RUNNER_TEMP/build-settings.txt" | head -n 1)
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$team</string>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Ilet.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log"

      - name: Inspect the signed app
        continue-on-error: true
        run: |
          ipa=("$RUNNER_TEMP"/export/*.ipa)
          unzip -q "${ipa[0]}" -d "$RUNNER_TEMP/ipa"
          app="$RUNNER_TEMP/ipa/Payload/Ilet.app"
          echo "::notice title=Bundle::$(ls "$app" | tr '\n' ' ' | cut -c 1-600)"
          info=$(codesign -dvvv "$app" 2>&1 | grep -E '^(Identifier|Format|CodeDirectory|TeamIdentifier|Sealed Resources|Internal requirements|Signature size)' \
            | tr '\n' ';' || true)
          echo "::notice title=Signature::$info"
          requirement=$(codesign -d -r- "$app" 2>&1 | grep -E 'designated' \
            | sed -E 's/"(Apple|iPhone) Distribution: [^"]*"/"\1 Distribution: <name>"/g' | cut -c 1-900 || true)
          echo "::notice title=Designated requirement::$requirement"
          verify=$(codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | tr '\n' ';' | cut -c 1-600 || true)
          echo "::notice title=Verify::$verify"
          codesign -d --entitlements - --xml "$app" > "$RUNNER_TEMP/entitlements.plist" 2> /dev/null || true
          codesign -d --extract-certificates="$RUNNER_TEMP/certificate-" "$app" 2> /dev/null || true
          security cms -D -i "$app/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist" 2> /dev/null || true
          python3 - "$RUNNER_TEMP" <<'PY'
          import glob, hashlib, json, os, plistlib, re, subprocess, sys
          temp = sys.argv[1]
          def notice(title, text):
              print(f"::notice title={title}::{text[:1500]}")
          # The certificate's kind and expiry only: the rest of its subject holds the owner's name.
          def kind(der):
              path = os.path.join(temp, "cert.der")
              open(path, "wb").write(der)
              out = subprocess.run(["/usr/bin/openssl", "x509", "-inform", "DER", "-noout", "-subject", "-enddate", "-in", path],
                                   capture_output=True, text=True).stdout
              cn = re.search(r"CN\s*=\s*([^:/,\n]+)", out)
              until = re.search(r"notAfter=(.*)", out)
              return (cn.group(1).strip() if cn else "unknown") + " until " + (until.group(1).strip() if until else "?")
          try:
              entitlements = plistlib.load(open(os.path.join(temp, "entitlements.plist"), "rb"))
              notice("Entitlements", json.dumps(entitlements, default=str))
          except Exception as error:
              notice("Entitlements", f"unreadable: {error}")
          signing = sorted(glob.glob(os.path.join(temp, "certificate-*")))
          signing_sha1 = hashlib.sha1(open(signing[0], "rb").read()).hexdigest() if signing else None
          if signing:
              notice("Signing certificate", kind(open(signing[0], "rb").read()) + f" sha1={signing_sha1[:8]}")
          try:
              profile = plistlib.load(open(os.path.join(temp, "profile.plist"), "rb"))
              certs = profile.get("DeveloperCertificates", [])
              listed = [hashlib.sha1(c).hexdigest() for c in certs]
              notice("Profile", f"name={profile.get('Name')!r} team={profile.get('TeamIdentifier')} "
                     f"devices={'ProvisionedDevices' in profile} expires={profile.get('ExpirationDate')} "
                     f"certificates={len(certs)} signingCertificateListed={signing_sha1 in listed} "
                     f"entitlements={json.dumps(profile.get('Entitlements'), default=str)}")
              for index, der in enumerate(certs[:4]):
                  notice(f"Profile certificate {index + 1}", kind(der) + f" sha1={listed[index][:8]}")
          except Exception as error:
              notice("Profile", f"unreadable: {error}")
          PY

      - name: Validate and upload with altool
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          ipa=("$RUNNER_TEMP"/export/*.ipa)
          one_line() { tr '\n' ' ' | sed -E 's/ +/ /g' | cut -c 1-1500; }
          echo "::notice title=altool::$(xcrun altool --version 2>&1 | one_line)"
          if xcrun altool --validate-app -f "${ipa[0]}" -t ios --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" --output-format json > "$RUNNER_TEMP/validate.txt" 2>&1; then
            echo "::notice title=Validate::passed: $(one_line < "$RUNNER_TEMP/validate.txt")"
          else
            echo "::error title=Validate::$(one_line < "$RUNNER_TEMP/validate.txt")"
            exit 1
          fi
          if xcrun altool --upload-app -f "${ipa[0]}" -t ios --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" --output-format json > "$RUNNER_TEMP/upload.txt" 2>&1; then
            echo "::notice title=Uploaded::Build $BUILD_NUMBER: $(one_line < "$RUNNER_TEMP/upload.txt")"
          else
            echo "::error title=Upload::$(one_line < "$RUNNER_TEMP/upload.txt")"
            exit 1
          fi

      - name: Delete the App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/private_keys"
