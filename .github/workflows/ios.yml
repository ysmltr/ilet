# Checks the iPhone app on one of GitHub's Macs: lint, unit tests, a full app build and the
# unsigned archive that the TestFlight workflow uploads, and the tests of that workflow's helper.
# This is how the iOS code gets compiled without owning a Mac.
name: iOS

on:
  push:
    branches: [main]
    paths: [ios/**, .github/scripts/**, .github/workflows/ios.yml]
  pull_request:
    paths: [ios/**, .github/scripts/**, .github/workflows/ios.yml]
  workflow_dispatch:

# Read-only: the workflow never changes the repository and uses no secrets.
permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # A fixed Xcode, so a new default on the runner cannot change the result. Uploads to TestFlight
  # need Xcode 26 or later.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  # Same rules as the npm packages: exact versions, released at least 14 days earlier, and checked
  # against the SHA-256 that GitHub publishes for each release file.
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  SWIFTLINT_VERSION: 0.65.1
  SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: ios
    steps:
      # Pinned to a commit, because a tag such as v7 can be moved to different code.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen and SwiftLint
        id: tools
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          download() {
            curl --fail --silent --show-error --location --output "$tools/$1" "$2"
            echo "$3  $tools/$1" | shasum --algorithm 256 --check
          }
          download xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" \
            "$XCODEGEN_SHA256"
          download swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip" \
            "$SWIFTLINT_SHA256"
          for program in xcodegen swiftlint; do
            unzip -q "$tools/$program.zip" -d "$tools/$program"
            # XcodeGen finds its templates next to its binary, so the folders stay as unpacked.
            binary=$(find "$tools/$program" -type f -name "$program" | head -n 1)
            test -x "$binary"
            dirname "$binary" >> "$GITHUB_PATH"
          done

      - name: Show tool versions
        run: |
          xcodebuild -version
          xcodegen --version
          swiftlint version
          xcrun swift-format --version

      # From here on, each check also runs when an earlier one failed, so one run reports every
      # problem. Problems are reported as annotations, which can be read through GitHub's API
      # without signing in.
      - name: SwiftLint (zero warnings)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: swiftlint lint --strict --reporter github-actions-logging

      # Before the tests, so swift-format never sees the files that `swift test` writes to .build.
      - name: swift-format (zero warnings)
        id: format
        if: ${{ !cancelled() }}
        run: |
          xcrun swift-format lint --strict --recursive Ilet IletShare IletKit 2>&1 \
            | sed -E 's|^([^:]+):([0-9]+):([0-9]+): [a-z]+: (.*)$|::error file=ios/\1,line=\2,col=\3::\4|'

      # swift-format needs a Mac, so the run publishes the changes it wants as a patch, in notices
      # titled "swift-format patch N of M"; joined in order, they apply with `git apply`. The files
      # are restored afterwards, so the later steps check exactly what was committed.
      - name: Show swift-format's changes
        if: ${{ !cancelled() && steps.format.outcome == 'failure' }}
        run: |
          xcrun swift-format format --in-place --recursive Ilet IletShare IletKit
          git diff > "$RUNNER_TEMP/format.patch"
          git checkout -- .
          if [ ! -s "$RUNNER_TEMP/format.patch" ]; then
            echo "::notice title=swift-format patch::No layout changes; the findings above need fixing by hand."
            exit 0
          fi
          # GitHub keeps 4096 characters of a notice and shows 10 per step, so the patch is cut at
          # line ends into parts of at most 4000 bytes. A workflow command is a single line, so %,
          # CR and LF are escaped.
          perl -e '
            local $/;
            my @parts = ("");
            for my $line (split /(?<=\n)/, <STDIN>) {
              push @parts, "" if length($parts[-1]) > 0 && length($parts[-1] . $line) > 4000;
              $parts[-1] .= $line;
            }
            print "::warning::The patch has ", scalar(@parts), " parts; only 10 are shown.\n"
              if @parts > 10;
            for my $index (0 .. $#parts) {
              (my $body = $parts[$index]) =~ s/%/%25/g;
              $body =~ s/\r/%0D/g;
              $body =~ s/\n/%0A/g;
              printf "::notice title=swift-format patch %d of %d::%s\n", $index + 1, scalar(@parts), $body;
            }
          ' < "$RUNNER_TEMP/format.patch"

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: |
          swift test --package-path IletKit -Xswiftc -warnings-as-errors 2>&1 \
            | xcbeautify --renderer github-actions

      # The App Store Connect helper of testflight.yml, with made-up keys and a fake Apple.
      - name: TestFlight helper tests
        if: ${{ !cancelled() }}
        run: node --test ../.github/scripts/app-store-connect.test.mjs

      - name: Generate the Xcode project
        id: project
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: xcodegen generate

      # Signing needs an Apple developer account; a simulator build checks everything else.
      - name: Build the app
        if: ${{ !cancelled() && steps.project.outcome == 'success' }}
        run: |
          xcodebuild build \
            -project Ilet.xcodeproj -scheme Ilet -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            | xcbeautify --renderer github-actions

      # The unsigned archive that testflight.yml signs and uploads, made the same way. Its export
      # needs an iOS app archive (one that holds only the app) with the Share Extension inside the
      # app, so that is checked here, on every change, rather than in a TestFlight run.
      - name: Archive as for TestFlight
        if: ${{ !cancelled() && steps.project.outcome == 'success' }}
        run: |
          archive="$RUNNER_TEMP/Ilet.xcarchive"
          xcodebuild archive \
            -project Ilet.xcodeproj -scheme Ilet -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
          problems=0
          problem() {
            echo "::error title=Archive::$1"
            problems=1
          }
          app_path=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:ApplicationPath' \
            "$archive/Info.plist" 2> /dev/null || true)
          [ "$app_path" = Applications/Ilet.app ] ||
            problem "This is not an iOS app archive of Ilet.app, so the export would refuse it."
          products=$(cd "$archive/Products" && find . -mindepth 1 -maxdepth 2 | sort | tr '\n' ' ')
          [ "$products" = "./Applications ./Applications/Ilet.app " ] ||
            problem "The archive holds more than the app: $products(set SKIP_INSTALL for the rest)."
          [ -f "$archive/Products/Applications/Ilet.app/PlugIns/IletShare.appex/IletShare" ] ||
            problem "The Share Extension is not inside the app, as PlugIns/IletShare.appex."
          exit "$problems"
