# Checks the iPhone app on one of GitHub's Macs: lint, unit tests and a full app build. This is
# how the iOS code gets compiled without owning a Mac.
name: iOS

on:
  push:
    branches: [main]
    paths: [ios/**, .github/workflows/ios.yml]
  pull_request:
    paths: [ios/**, .github/workflows/ios.yml]
  workflow_dispatch:

# Read-only: the workflow never changes the repository and uses no secrets.
permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # A fixed Xcode, so a new default on the runner cannot change the result. Uploads to TestFlight
  # need Xcode 26 or later.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  # Same rules as the npm packages: exact versions, released at least 14 days earlier, and checked
  # against the SHA-256 that GitHub publishes for each release file.
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  SWIFTLINT_VERSION: 0.65.1
  SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ios
    steps:
      # Pinned to a commit, because a tag such as v7 can be moved to different code.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen and SwiftLint
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          download() {
            curl --fail --silent --show-error --location --output "$tools/$1" "$2"
            echo "$3  $tools/$1" | shasum --algorithm 256 --check
          }
          download xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" \
            "$XCODEGEN_SHA256"
          download swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip" \
            "$SWIFTLINT_SHA256"
          for program in xcodegen swiftlint; do
            unzip -q "$tools/$program.zip" -d "$tools/$program"
            # XcodeGen finds its templates next to its binary, so the folders stay as unpacked.
            binary=$(find "$tools/$program" -type f -name "$program" | head -n 1)
            test -x "$binary"
            dirname "$binary" >> "$GITHUB_PATH"
          done

      - name: Show tool versions
        run: |
          xcodebuild -version
          xcodegen --version
          swiftlint version
          xcrun swift-format --version

      # Before the tests, so swift-format never sees the files that `swift test` writes to .build.
      - name: Lint (zero warnings)
        run: |
          swiftlint lint --strict
          xcrun swift-format lint --strict --recursive Ilet IletKit

      - name: Unit tests
        run: swift test --package-path IletKit -Xswiftc -warnings-as-errors

      - name: Generate the Xcode project
        run: xcodegen generate

      # Signing needs an Apple developer account; a simulator build checks everything else.
      - name: Build the app
        run: |
          xcodebuild build \
            -project Ilet.xcodeproj -scheme Ilet -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            | xcbeautify --renderer github-actions
