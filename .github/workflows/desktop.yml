# Checks the Windows app on one of GitHub's Windows PCs and builds its installer and its Microsoft
# Store package, for every change to the desktop app. Started by hand (Actions > Desktop > Run
# workflow, on main), it also puts the installer in a draft GitHub release, which only people who
# can push to this repository see until it is published. README.md and desktop/STORE.md describe
# the steps.
name: Desktop

on:
  push:
    branches: [main]
    paths: [desktop/**, branding/**, .github/workflows/desktop.yml]
  pull_request:
    paths: [desktop/**, branding/**, .github/workflows/desktop.yml]
  workflow_dispatch:

# Read-only, except for the release job, which runs none of the repository's code. No secrets.
permissions:
  contents: read

# Releases run one at a time and are never cancelled. For the checks, a newer push cancels the
# older run.
concurrency:
  group: desktop-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Builds from a fresh checkout every time and uses no caches, because a cache that another run
  # wrote could change what goes into a release.
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: desktop
    outputs:
      version: ${{ steps.installer.outputs.version }}
      file: ${{ steps.installer.outputs.file }}
      store-file: ${{ steps.installer.outputs.store-file }}
    steps:
      # Pinned to a commit, because a tag such as v7 can be moved to different code.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the branch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Branch::Releases are made from main only: choose main under Run workflow."
          exit 1

      # The runner's own Node.js runs only the build tools. None of it goes into the installer,
      # because the app runs on Electron's own Node.js.
      - name: Show tool versions
        run: |
          node --version
          npm --version

      # Exactly the packages in package-lock.json, each checked against the hash recorded there.
      # .npmrc stops their install scripts.
      - name: Install the packages
        run: npm ci

      - name: Type check, lint (zero warnings) and tests
        run: npm run check

      # Only builds; the release job below publishes.
      - name: Build the installer and the Store package
        run: npm run package -- --publish never

      - name: Find the installer and the Store package
        id: installer
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Version::The version in desktop/package.json must look like 1.2.3."
            exit 1
          fi
          file="ilet-Setup-$version.exe"
          store_file="ilet-Store-$version.appx"
          test -f "release/$file"
          test -f "release/$store_file"
          sha256sum "release/$file" "release/$store_file"
          {
            echo "version=$version"
            echo "file=$file"
            echo "store-file=$store_file"
          } >> "$GITHUB_OUTPUT"

      # Hands the installer to the release job; a day is plenty.
      - name: Keep the installer for the release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: desktop/release/${{ steps.installer.outputs.file }}
          if-no-files-found: error
          retention-days: 1
          # The installer is compressed already.
          compression-level: 0

      # For Partner Center (desktop/STORE.md), and for trying it on a PC in Developer Mode. Not
      # signed: the Store signs what it accepts.
      - name: Keep the Store package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-package
          path: desktop/release/${{ steps.installer.outputs.store-file }}
          if-no-files-found: error
          retention-days: 7
          # The package is a compressed archive already.
          compression-level: 0

  # The only job that can write to the repository. So it runs none of the repository's code and no
  # npm package: it takes the installer and the Store package that the build job made, attests
  # where both come from and makes the draft release, with the installer only.
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # To make the draft release.
      contents: write
      # To sign the attestation and store it.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      FILE: ${{ needs.build.outputs.file }}
      STORE_FILE: ${{ needs.build.outputs.store-file }}
    steps:
      # Each version is released once, so a release, draft or tag of this version means that the
      # version in desktop/package.json has to go up first.
      - name: Check the version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$FILE" != "ilet-Setup-$VERSION.exe" ||
            "$STORE_FILE" != "ilet-Store-$VERSION.appx" ]]; then
            echo "::error title=Version::The build job reported an unexpected version or file name."
            exit 1
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1 ||
            gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::error title=Version::v$VERSION exists already, as a release, a draft or a tag. Raise the version in desktop/package.json, or delete the old draft, and run this again."
            exit 1
          fi

      - name: Take the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: installer

      - name: Take the Store package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-package
          path: store-package

      # A public record, signed through Sigstore, that these exact files were built by this
      # workflow from this commit. Anyone can check it with `gh attestation verify`.
      - name: Attest where the installer and the Store package come from
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            installer/${{ env.FILE }}
            store-package/${{ env.STORE_FILE }}

      - name: Make the draft release
        run: |
          hash=$(sha256sum "installer/$FILE" | cut -d ' ' -f 1)
          # Versions before 1.0.0 are pre-releases.
          prerelease=()
          if [[ "$VERSION" == 0.* ]]; then
            prerelease=(--prerelease)
          fi
          # The shell would run what stands between backticks, so the text escapes them (\`). Each
          # paragraph stays on one line, because GitHub keeps the line breaks of release notes.
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ilet puts the photos, videos and files that you share from the ilet iPhone app into a folder on this PC (Downloads › ilet), straight over your Wi-Fi: no account, no cloud.

          ### Install

          1. Download **$FILE** below. It needs Windows 10 or 11. Your browser may warn that the file isn't commonly downloaded: choose **Keep**.
          2. Open it. It is not signed with a code-signing certificate yet, so Windows may show "Windows protected your PC": click **More info**, check that the app is $FILE, then click **Run anyway**.
          3. Allow the administrator prompt: ilet is installed for all users, with firewall rules that let phones reach it on Private networks only.

          ilet works on networks that Windows calls **Private**, such as your home Wi-Fi. On a Public network, such as café or airport Wi-Fi, it stays closed and tells you so, because anyone on that network could reach it.

          ### Check the download (optional)

          - SHA-256: \`$hash\`. In PowerShell, \`Get-FileHash ~/Downloads/$FILE\` shows the same value.
          - GitHub Actions built this file from commit $GITHUB_SHA ([the build]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)). With the GitHub CLI, \`gh attestation verify $FILE --repo $GH_REPO\` checks that.
          EOF
          url=$(gh release create "v$VERSION" "installer/$FILE" --draft "${prerelease[@]}" \
            --target "$GITHUB_SHA" --title "ilet $VERSION for Windows" \
            --notes-file "$RUNNER_TEMP/notes.md")
          echo "::notice title=Draft release::ilet $VERSION is a draft release now: $url. Check it, then publish it with the pencil (Edit) and Publish release."
