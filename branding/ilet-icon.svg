    <linearGradient id="monitor-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <clipPath id="phone-glass">
      <rect x="186" y="406" width="96" height="212" rx="17"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="#EEECE7"/>

