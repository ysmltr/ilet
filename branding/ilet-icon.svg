<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">ilet</title>
  <!-- A paper plane flies from the phone to the PC. desktop/scripts/render-icons.mjs also renders
       this drawing without the tile, as the iPhone app's logo on the launch and welcome screens. -->
  <defs>
    <!-- Cuts a gap around the phone out of the PC, so the two stay apart on any background. -->
    <mask id="phone-gap">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <rect x="618" y="342" width="308" height="512" rx="84" fill="#000000"/>
    </mask>
  </defs>
  <rect id="tile" width="1024" height="1024" rx="228" fill="#F3F8FC"/>
  <g mask="url(#phone-gap)">
    <g fill="#CFE3F6" stroke="#6F98C6" stroke-width="24" stroke-linejoin="round">
      <path d="M404 626 H480 L498 728 H386 Z"/>
      <rect x="312" y="716" width="260" height="56" rx="28"/>
      <rect x="132" y="212" width="620" height="424" rx="56"/>
    </g>
    <rect x="176" y="256" width="532" height="300" rx="26" fill="#EEF6FD"/>
    <g fill="#8DB3DA">
      <circle cx="532" cy="468" r="13"/>
      <circle cx="572" cy="501" r="10"/>
      <circle cx="606" cy="529" r="7"/>
    </g>
    <path d="M307 269 L557 374 L457 414 Z" fill="#F8D36A"/>
    <path d="M307 269 L482 404 L457 414 Z" fill="#A9DFB8"/>
    <path d="M307 269 L457 414 L412 519 Z" fill="#F2897B"/>
    <path d="M307 269 L457 414 L441 451 Z" fill="#4DB6AC"/>
  </g>
  <rect x="650" y="374" width="244" height="448" rx="52" fill="#BFE8D6" stroke="#5DAE8F" stroke-width="24"/>
  <rect x="680" y="404" width="184" height="388" rx="30" fill="#E8F8F0"/>
  <rect x="740" y="422" width="64" height="18" rx="9" fill="#5DAE8F"/>
</svg>
